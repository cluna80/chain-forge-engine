[package]
name    = "chain-forge-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name    = "chain_forge_node"
path    = "src/lib.rs"

[[bin]]
name = "chain-forge-node"
path = "src/main.rs"

[[bin]]
name = "chain-forge-keygen"
path = "src/keygen.rs"

[[bin]]
name = "chain-forge-tx"
path = "src/tx.rs"

[[bin]]
name = "gc-daemon"
path = "src/bin/gc-daemon.rs"

[dependencies]
chain-forge-core      = { path = "../chain-forge-core" }
chain-forge-consensus = { path = "../chain-forge-consensus", features = ["real-crypto"] }
chain-forge-state     = { path = "../chain-forge-state" }
chain-forge-execution = { path = "../chain-forge-execution" }
chain-forge-p2p       = { path = "../chain-forge-p2p", features = ["real-network"] }
chain-forge-pocd    = { path = "../chain-forge-pocd" }
chain-forge-identity  = { path = "../chain-forge-identity" }
chain-forge-agents    = { path = "../chain-forge-agents" }
chain-forge-slashing  = { path = "../chain-forge-slashing", features = ["real-crypto"] }
chain-forge-validators = { path = "../chain-forge-validators" }
chain-forge-crypto    = { path = "../chain-forge-crypto", features = ["real-crypto", "real-pqc"] }
chain-forge-personhood = { path = "../chain-forge-personhood", optional = true }
dis-core              = { path = "../dis-core" }
serde                 = { workspace = true }
serde_json            = { workspace = true }
sha2                  = { workspace = true }
hex                   = { workspace = true }
thiserror             = { workspace = true }
tracing               = { workspace = true }
tokio                 = { workspace = true }
async-trait           = { workspace = true }
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
getrandom             = { version = "0.2" }

[features]
# Use real libp2p networking instead of the in-memory mock.
# Enabled by default so `cargo build --bin chain-forge-node` and the
# devnet integration tests always produce a real-network binary.
# Unit tests (cfg(test)) are carved out inside node.rs so they still
# use the fast in-memory mock regardless of this feature flag.
real-network = []
# Enable ZK-VRC personhood proof verification in the execution layer (QPC-GAP-002).
# Adds chain-forge-personhood (Groth16/ark-*) as a build dependency.
# Without this feature, VerifyIdentityWithProof txs are accepted as a tx type
# but execution fails closed ("no pop_verifier configured").
zk-vrc = ["chain-forge-personhood"]
# Devnet bootstrap only: lets a devnet genesis opt into identity parameters
# weaker than production (identity.insecure_dev_identity_overrides).
# Never enable for testnet or mainnet builds.
insecure-dev-quorum = ["chain-forge-core/insecure-dev-quorum"]
default = ["real-network"]

[dev-dependencies]
tokio             = { workspace = true }
serde_json        = { workspace = true }
hex               = { workspace = true }
criterion         = { version = "0.5", features = ["html_reports"] }
rayon             = { version = "1" }
chain-forge-consensus = { path = "../chain-forge-consensus", features = ["real-crypto"] }
chain-forge-p2p       = { path = "../chain-forge-p2p", features = ["real-network"] }
chain-forge-crypto    = { path = "../chain-forge-crypto", features = ["real-crypto", "real-pqc"] }
chain-forge-execution = { path = "../chain-forge-execution" }
chain-forge-vca-pq    = { path = "../chain-forge-vca-pq" }
chain-forge-wallet    = { path = "../chain-forge-wallet" }
tempfile              = { version = "3" }

[[bench]]
name    = "bft_round_mldsa"
harness = false

[[test]]
name = "devnet_4node"
path = "tests/devnet_4node.rs"

[[test]]
name = "adversarial_gossip"
path = "tests/adversarial_gossip.rs"

[[test]]
name = "attestation_live"
path = "tests/attestation_live.rs"

[[test]]
name = "personhood_live"
path = "tests/personhood_live.rs"

[[test]]
name = "vca_pq_live"
path = "tests/vca_pq_live.rs"

[[test]]
name = "validator_key_live"
path = "tests/validator_key_live.rs"

[[test]]
name = "dis_parity"
path = "tests/dis_parity.rs"

[[test]]
name = "dis_auth_live"
path = "tests/dis_auth_live.rs"

[[test]]
name = "mldsa_tx_live"
path = "tests/mldsa_tx_live.rs"

[[test]]
name = "timestamp_monotonic_live"
path = "tests/timestamp_monotonic_live.rs"

[[test]]
name = "pocd_reward_live"
path = "tests/pocd_reward_live.rs"

[[test]]
name = "h0_3_crash_recovery_live"
path = "tests/h0_3_crash_recovery_live.rs"

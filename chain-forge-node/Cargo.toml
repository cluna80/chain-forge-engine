[package]
name    = "chain-forge-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "chain-forge-node"
path = "src/main.rs"

[dependencies]
chain-forge-core      = { path = "../chain-forge-core" }
chain-forge-consensus = { path = "../chain-forge-consensus", features = ["real-crypto"] }
chain-forge-state     = { path = "../chain-forge-state" }
chain-forge-execution = { path = "../chain-forge-execution" }
chain-forge-p2p       = { path = "../chain-forge-p2p", features = ["real-network"] }
chain-forge-cirfi     = { path = "../chain-forge-cirfi" }
chain-forge-slashing    = { path = "../chain-forge-slashing" }
chain-forge-validators  = { path = "../chain-forge-validators" }
chain-forge-identity  = { path = "../chain-forge-identity" }
chain-forge-crypto    = { path = "../chain-forge-crypto", features = ["real-crypto"] }
serde                 = { workspace = true }
serde_json            = { workspace = true }
thiserror             = { workspace = true }
tracing               = { workspace = true }
tokio                 = { workspace = true }
async-trait           = { workspace = true }
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }

[features]
# Use real libp2p networking instead of the in-memory mock.
# Off by default so `cargo test` stays fast; enable for real deployments:
#   cargo run --release --features real-network -- --genesis genesis.json
real-network = []

[dev-dependencies]
tokio = { workspace = true }

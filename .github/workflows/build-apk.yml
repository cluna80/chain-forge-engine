name: Build DIS Wallet APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'dis-wallet-android/**'
      - 'dis-core/**'
      - 'dis-vendor-server/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-apk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-apk-

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configure Rust Android linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'CARGO'
          [target.aarch64-linux-android]
          linker = "${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          ar = "${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          CARGO

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build Rust JNI for Android ARM64
        run: |
          export ANDROID_NDK_HOME=${{ env.ANDROID_NDK_HOME }}
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # Create symlink for cc-rs
          ln -sf $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang \
                 $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang
          
          cargo build -p dis-wallet-jni --target aarch64-linux-android --release

      - name: Copy .so to Android project
        run: |
          mkdir -p dis-wallet-android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libdis_wallet.so \
             dis-wallet-android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Debug APK
        run: |
          cd dis-wallet-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dis-wallet-debug-${{ github.sha }}
          path: dis-wallet-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to release (on main push)
        uses: actions/upload-artifact@v4
        with:
          name: dis-wallet-latest
          path: dis-wallet-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

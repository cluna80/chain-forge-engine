name: Build DIS Wallet APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'dis-wallet-android/**'
      - 'dis-core/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-apk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-apk-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configure Rust Android linker
        run: |
          NDK_BIN=$ANDROID_SDK_ROOT/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << CARGO
          [target.aarch64-linux-android]
          linker = "$NDK_BIN/aarch64-linux-android34-clang"
          ar = "$NDK_BIN/llvm-ar"
          CARGO
          # Symlink for cc-rs
          ln -sf $NDK_BIN/aarch64-linux-android34-clang $NDK_BIN/aarch64-linux-android-clang

      - name: Build Rust JNI for Android ARM64
        run: |
          export PATH=$ANDROID_SDK_ROOT/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cargo build -p dis-wallet-jni --target aarch64-linux-android --release

      - name: Copy .so to Android project
        run: |
          mkdir -p dis-wallet-android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libdis_wallet.so \
             dis-wallet-android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Debug APK
        run: |
          cd dis-wallet-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dis-wallet-debug
          path: dis-wallet-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

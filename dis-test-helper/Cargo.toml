[package]
name        = "dis-test-helper"
version     = "0.1.0"
edition     = "2021"
description = "CLI helper for Agent8 I11 live DIS test — generates Dilithium3 keys, signs delegations and transcripts"

[[bin]]
name = "dis-test-helper"
path = "src/main.rs"

[dependencies]
dis-core            = { path = "../dis-core" }
pqcrypto-dilithium  = "0.5"
pqcrypto-traits     = "0.3"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
hex                 = "0.4"
sha2                = "0.10"

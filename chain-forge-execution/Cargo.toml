[package]
name    = "chain-forge-execution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Execution layer: transaction types, validation, gas metering,
# state transition application.
# Bridges consensus (ordering) and state (storage).

[dependencies]
chain-forge-core     = { path = "../chain-forge-core" }
chain-forge-state    = { path = "../chain-forge-state" }
chain-forge-identity = { path = "../chain-forge-identity" }
chain-forge-qrc    = { path = "../chain-forge-qrc" }
chain-forge-pocd   = { path = "../chain-forge-pocd" }
chain-forge-agents   = { path = "../chain-forge-agents" }
chain-forge-resource = { path = "../chain-forge-resource" }
# Always real Ed25519. The crypto crate's stub verify() recomputes the
# "signature" from the PUBLIC key, so anyone could forge one -- it must
# never be what guards transaction execution.
chain-forge-crypto   = { path = "../chain-forge-crypto", features = ["real-crypto"] }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

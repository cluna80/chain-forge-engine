[workspace]
resolver = "2"
members = [
    "dis-vendor-server",
    "dis-wallet-android/dis-jni",
    "chain-forge-sim",
    "chain-forge-service",
    "chain-forge-core",
    "chain-forge-consensus",
    "chain-forge-p2p",
    "chain-forge-state",
    "chain-forge-execution",
    "chain-forge-identity",
    "chain-forge-agents",
    "chain-forge-tokenomics",
    "chain-forge-crypto",
    "chain-forge-validators",
    "chain-forge-governance",
    "chain-forge-slashing",
    "chain-forge-node",
    "chain-forge-personhood",
    "chain-forge-vca-pq",
    "chain-forge-pocd",
    "chain-forge-research-db",
    "chain-forge-scheduler",
    "chain-forge-verifier",
    "chain-forge-intelligence",
    "chain-forge-miner",
    "chain-forge-verifier-bin",
    "chain-forge-keygen",
    "chain-forge-seed",
    "chain-forge-wallet",
    "dis-core",
    "chain-forge-analyzer",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["cluna80"]
license     = "MIT"
repository  = "https://github.com/cluna80/chain-forge-engine"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
sha3        = "0.10"
hex         = "0.4"
thiserror   = "1"
async-trait = "0.1"
tracing     = "0.1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }


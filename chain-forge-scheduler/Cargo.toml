[package]
name        = "chain-forge-scheduler"
description = "Change Set E — Continuous Research Scheduling for the QCB Discovery Engine"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true

[dependencies]
chain-forge-research-db = { path = "../chain-forge-research-db" }
chain-forge-execution    = { path = "../chain-forge-execution" }
chain-forge-crypto       = { path = "../chain-forge-crypto", features = ["real-pqc"] }
chain-forge-qrc          = { path = "../chain-forge-qrc" }
sha2                     = { workspace = true }
hex                      = { workspace = true }
reqwest                  = { version = "0.12", features = ["json"] }

tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }

axum         = { version = "0.7", features = ["json"] }
tower        = { version = "0.4" }
tower-http   = { version = "0.5", features = ["trace"] }

# Binary-only deps
clap              = { version = "4", features = ["derive", "env"] }
anyhow            = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "qcb-scheduler"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true }

[package]
name    = "chain-forge-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chain-forge-core   = { path = "../chain-forge-core" }
chain-forge-crypto = { path = "../chain-forge-crypto", features = ["real-crypto"], optional = true }
chain-forge-vca-pq = { path = "../chain-forge-vca-pq" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
sha3        = { workspace = true, optional = true }
# Separate, renamed dependency so the PQ-HotStuff-2 FIPS 204 adapter enables ONLY the fips204-backend feature of chain-forge-crypto
# (the `chain-forge-crypto` entry above enables real-crypto, which is Ed25519, and stays tied to the `real-crypto` feature).
fips204-crypto = { package = "chain-forge-crypto", path = "../chain-forge-crypto", features = ["fips204-backend"], optional = true }

[features]
real-crypto = ["chain-forge-crypto", "chain-forge-crypto/real-pqc"]
# PQ-HotStuff-2 (docs/pq-hotstuff-001-spec.md). Phase 0: not in any default feature set; no network activates it.
pq-hotstuff = ["dep:sha3"]
# The real FIPS 204 ML-DSA-65 adapter for the safety-state signer/verifier traits (in-memory keys only; off by default).
pq-hotstuff-fips204 = ["pq-hotstuff", "dep:fips204-crypto"]

[dev-dependencies]
tokio = { workspace = true }
